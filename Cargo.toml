[package]
name = "wp-core-connectors"
version = "0.9.2" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
authors = ["WarpParse Dev Team"]
description = "Core connector registry and sink runtimes for WarpParse"
repository = "https://github.com/wp-labs/wp-core-connectors"
homepage = "https://github.com/wp-labs/wp-core-connectors"
documentation = "https://docs.rs/wp-core-connectors"
keywords = ["warpparse", "connector", "sink", "syslog", "arrow"]
categories = ["asynchronous", "network-programming"]

[lib]
name = "wp_core_connectors"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
arrow = { version = "60", default-features = false, features = ["ipc"] }
async-trait = "0.1"
base64 = "0.23"
bytes = "1.11"
chrono = "0.4"
glob = "0.3"
hostname = "0.4"
hex = "0.4"
libc = "0.2"
once_cell = "1.21"
serde_json = "1.0"
log = "0.4"
memchr = "2.7"
socket2 = "0.6"
toml = "1.0"
orion_conf = "0.7"
orion-error = { version = "0.8", features = ["anyhow"] }
thiserror = "2"
tokio = { version = "1.51", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
wp-connector-api = "0.13"
wp-connector-utils = "0.4.1"
wf-connector-api =  "0.3"
wp-model-core = "0.10"
wp-conf-base = "0.6"
wp-data-fmt = "0.10"
wp-log = "0.4"

[features]
dev-tools = []

[dev-dependencies]

async-broadcast = "0.7"
tempfile = "3.23"
rcgen = "0.13"
